<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excursion Cost Calculator</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div>
        <h1>Excursion Cost Calculator</h1>
        <p>Work out how much each student needs to pay.</p>
        <form>
            <label for="bus"><b>Bus hire ($)</b></label><br>
            <input type="number" name="bus"> <br><br>

            <label for="fee"><b>Entry fee per student ($)</b></label><br>
            <input type="number" name="fee"> <br><br>

            <label for="number"><b>Number of students</b></label><br>
            <input type="number" name="number"> <br><br>

            <button type="submit">Calculate</button>
        </form>

        <p class="answer">PLACEHOLDER</p>

    </div>
</body>
</html>
